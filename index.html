<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante La Esquina - Pedidos</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header class="encabezado">
        <h1>🍽️ Restaurante La Esquina</h1>
        <p>Gestión de pedidos del salón</p>
    </header>

    <nav class="navegacion">
        <a href="#nuevo">Nuevo pedido</a>
        <a href="#pedidos">Pedidos</a>
    </nav>

    <main class="principal">

        <!-- Sección: alta de pedido -->
        <section id="nuevo" class="seccion">
            <h2>Tomar pedido</h2>

            <form id="formPedido" class="formulario">

                <label for="mesa">Mesa</label>
                <input type="number" id="mesa" min="1" step="1"
                       placeholder="Ej: 3" required>

                <label for="plato">Plato</label>
                <!-- Combo poblado desde la API (usp_ListarPlatos) -->
                <select id="plato" required>
                    <option value="">Cargando menú...</option>
                </select>

                <label for="cantidad">Cantidad</label>
                <input type="number" id="cantidad" min="1" step="1" value="1" required>

                <button type="submit">Enviar a cocina</button>
            </form>

            <p id="mensaje" class="mensaje"></p>
        </section>

        <!-- Sección: listado de pedidos -->
        <section id="pedidos" class="seccion">
            <div class="barra-listado">
                <h2>Pedidos</h2>
                <div class="filtros">
                    <button id="btnTodos" class="activo">Todos</button>
                    <button id="btnActivos">En curso</button>
                </div>
            </div>
            <div id="listadoPedidos" class="tarjetas">
                <!-- Las tarjetas se generan desde app.js -->
            </div>
        </section>

    </main>

    <footer class="pie">
        <p>Programación II - Clase 03 · Instituto Superior Villa del Rosario · 2026</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
